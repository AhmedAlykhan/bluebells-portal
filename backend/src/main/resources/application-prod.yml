server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BluebellsProdHikariPool
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 300000
      keepalive-time: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    info:
      enabled: false

bluebells:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  storage:
    upload-dir: ${STORAGE_DIR:/var/bluebells/storage}
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:admin}
    password: ${INITIAL_ADMIN_PASSWORD}
    email: ${INITIAL_ADMIN_EMAIL:admin@bluebells.edu.pk}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://bluebells-portal.vercel.app}

logging:
  level:
    root: INFO
    com.bluebells: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
