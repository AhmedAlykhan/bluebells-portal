server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/bluebells_school_db?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Karachi}
    username: ${SPRING_DATASOURCE_USERNAME:2F3Ja9P3r4bNoZp.root}
    password: ${SPRING_DATASOURCE_PASSWORD:ShebVLbjn7wyU4eK}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BluebellsProdHikariPool
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    info:
      enabled: false

bluebells:
  jwt:
    secret: ${JWT_SECRET:jfcX15zDXK5Dy9f3IyLn5VVckpzXQhYzW/cSPKBqQeNtBAKceWCG1py4nU3pXp5XhNKfOX4NADzRxSoEwHhipw==}
    expiration-ms: 86400000 # 24h
  storage:
    upload-dir: ${STORAGE_DIR:./storage/uploads}
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:admin}
    password: ${INITIAL_ADMIN_PASSWORD:Admin@12345}
    email: ${INITIAL_ADMIN_EMAIL:admin@bluebells.edu.pk}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    root: INFO
    com.bluebells: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
