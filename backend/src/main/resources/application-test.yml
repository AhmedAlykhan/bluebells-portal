spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bluebells_school_test_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Karachi&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.bluebells: INFO
